business_goals:
  - id: BG-001
    statement: "Reduce the measured cost of a silent-night-class incident from its EUR 260,411 pilot-region baseline (EUR 20,832,904 projected at 400-store scale) to under EUR 50,000 pilot-region-equivalent by month 6 and under EUR 20,000 by month 12, at the same assumed incident frequency."
    priority: MUST
    kpi: "silent-night-class incident cost, Night Gauntlet / Cost-of-a-Silent-Night business-impact model."
    smart_status: PASS
  - id: BG-002
    statement: "Ensure at least 95% of cases above the safe-limit threshold for more than 30 minutes reach an acknowledged, reachable on-call contact within 15 minutes, and 100% within 30 minutes, on the validation cohort by month 6 and chain-wide by month 12."
    priority: MUST
    kpi: "Night Gauntlet detection field: minutes_to_detect and found_by, against baseline worst-case 347 minutes and 25% alarm-catch rate."
    smart_status: PASS
  - id: BG-003
    statement: "Make every remote session and fleet/single-case command attributable to one named individual and technically enforced (not merely logged) against an approved scope and window, 100% chain-wide by month 12, subject to CON-002."
    priority: MUST
    kpi: "Command audit completeness and approved-vs-executed scope/window mismatch report."
    smart_status: PASS
  - id: BG-004
    statement: "Eliminate reassuring or non-escalating store-assistant answers about cases needing a human food-safety decision (baseline 168 across a 10-night Night Gauntlet sample) to 0, verified per cohort before expansion, sustained chain-wide by month 6."
    priority: MUST
    kpi: "Night Gauntlet assistant-check hard gate."
    smart_status: PASS
  - id: BG-005
    statement: "Close both currently vacant ownership gaps (fleet commands since 2021; store assistant since 2024) and establish a monthly-attested, current escalation contact list, chain-wide, by month 3."
    priority: MUST
    kpi: "Ownership register vacancy count; contact-list staleness rate."
    smart_status: PASS
  - id: BG-006
    statement: "Validate BG-001 through BG-005 on an approximately 40-store cohort over 6 months before committing the remaining ~360 stores to the board's 400-store target, with gating criteria finalized in PRD scoping (Open Question Q-1)."
    priority: MUST
    kpi: "Gauntlet cohort scorecard Pass/Warn/Fail status against BG-001-BG-004 criteria."
    smart_status: PASS
