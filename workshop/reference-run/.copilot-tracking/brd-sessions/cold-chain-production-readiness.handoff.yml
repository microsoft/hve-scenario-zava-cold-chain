prd_consumer_notes: >
  This BRD rests entirely on a simulated Zava stakeholder panel (Stage 1 Design Thinking,
  two rounds; this BRD, one additional round) and an autonomous no-user-present authoring
  process (DD-005, DD-006). Treat it as a strong starting hypothesis for PRD scoping, not as
  settled business authorization. FR-010 and parts of BG-003 are blocked by CON-002 (vendor
  contract) until OPEN-3/Q-3 is resolved — do not scope FR-010 for full chain-wide
  implementation without that resolution. OPEN-1 (gating thresholds) and OPEN-2 (assistant-
  wrong-answer response) are the two items most likely to require PRD-phase stakeholder
  elicitation before BG-006's month-6 gate check can run as designed. Real legal, regulatory,
  food-safety, and end-shopper validation remain outstanding per WAIV-001, Assumption A-9, and
  Risk R-6; escalate to the orchestrator/user before any downstream phase treats this BRD as
  authorizing real budget, contract, or production changes.
