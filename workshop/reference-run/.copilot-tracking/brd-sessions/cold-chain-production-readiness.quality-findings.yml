iso_29148_attributes:
  sample_requirements: ["FR-001", "FR-006", "FR-011", "FR-017", "NFR-005"]
  scale: "0=absent, 1=weak, 2=adequate, 3=strong"
  scores:
    necessary: 3.0
    appropriate: 3.0
    unambiguous: 2.4
    complete: 2.2
    singular: 2.0
    feasible: 2.8
    verifiable: 2.6
    correct: 2.8
    conforming: 3.0
  notes: >
    Unambiguous/Complete/Correct are depressed mainly by the unresolved defrost-duration
    discrepancy affecting FR-001/BR-001 (A-7/Q-5) and NFR-005's explicitly deferred security
    mechanism (Q-6, now with a 60-minute minimum acceptance bar applied post-review). Singular
    is the weakest attribute: several FRs (FR-003, FR-005, FR-006, FR-011, FR-015, FR-017)
    bundle 2-3 distinct shall-clauses in a single statement.

